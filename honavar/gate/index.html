<!DOCTYPE html>
<html>
<head>
<script>
// ===== GitHub Pages bridge: makes google.script.run talk to the Apps Script API (PublicApi.gs) =====
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwIc6HXYxQoWzhJq9AcPv6uvrn8RXJ71-577cB6GNdTf03VEig29iM-LLhafmAgiaGvPg/exec';
  function call(fn, args, ok, fail) {
    fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
                 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                 body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { if (ok) ok(j.result); }
        else { var e = new Error((j && j.error) || 'Server error'); if (fail) fail(e); else console.error(fn, e); }
      })
      .catch(function (e) { if (fail) fail(e); else console.error(fn, e); });
  }
  function runner(ok, fail, uo) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail, uo); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f, uo); };
      if (k === 'withUserObject') return function (o) { return runner(ok, fail, o); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        call(String(k), args, ok ? function (r) { ok(r, uo); } : null, fail ? function (e) { fail(e, uo); } : null);
      };
    }});
  }
  window.google = window.google || {};
  window.google.script = { run: runner(null, null, undefined), host: { close: function () {} } };
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Check-In - Public Library Honavar</title>
<style>
  :root{ --navy:#1a3a6b; --gold:#c9922a; --cream:#fbf6ea; --gray:#666; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:Arial,Helvetica,sans-serif; color:#222;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,.08), transparent 40%),
      linear-gradient(135deg,#1a3a6b,#2a5298 60%,#3a6bb0);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px;
  }
  .brand{ text-align:center; color:#fff; margin-bottom:22px; }
  .brand h1{ margin:0; font-size:26px; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.25); line-height:1.3; }
  .brand .sub{ font-size:14px; opacity:.85; margin-top:8px; }

  .scan-card{
    background:#fff; border-radius:22px; padding:34px 28px; width:min(94vw,480px);
    box-shadow:0 18px 50px rgba(0,0,0,.30); text-align:center;
  }
  .scan-icon{ font-size:44px; margin-bottom:6px; animation:pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .scan-card input{
    width:100%; font-size:26px; text-align:center; padding:18px; margin-top:14px;
    border:3px solid #e2dcca; border-radius:14px; letter-spacing:2px; color:var(--navy); font-weight:bold;
  }
  .scan-card input:focus{ outline:none; border-color:var(--gold); }
  .scan-card .hint{ font-size:13px; color:var(--gray); margin-top:14px; }
  #nameSearchInput{ letter-spacing:normal !important; font-weight:normal !important; text-transform:none !important; font-size:17px !important; }
  .name-result-item{ background:#fff; border:2px solid #e2dcca; border-radius:10px; padding:12px; margin-top:6px; cursor:pointer; text-align:left; }
  .name-result-item:hover{ background:var(--cream); }
  .name-result-item b{ color:var(--navy); font-size:15px; }
  .name-result-item span{ color:var(--gray); font-size:12px; margin-left:8px; }

  /* ---- Popup modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,20,40,.55); display:none;
    align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(2px); padding:16px;
  }
  .overlay.show{ display:flex; }
  .popup{
    background:#fff; border-radius:26px; padding:32px 28px; width:min(92vw,440px); text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35); transform:scale(.85); opacity:0;
    animation:popIn .35s ease-out forwards;
  }
  @keyframes popIn{ to{ transform:scale(1); opacity:1; } }
  .popup.in{ border-top:8px solid #2fa86a; }
  .popup.out{ border-top:8px solid var(--gold); }
  .popup.vip{ border-top:8px solid transparent; border-image:linear-gradient(90deg,#d4af37,#f5d576,#d4af37) 1; background:linear-gradient(180deg,#fffdf5,#fff); }
  .popup.error{ border-top:8px solid #c0392b; }

  .avatar{
    width:120px; height:120px; border-radius:50%; margin:0 auto 16px; overflow:hidden;
    border:5px solid var(--cream); box-shadow:0 6px 18px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center; background:var(--cream);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar svg{ width:70%; height:70%; fill:#b9c3d6; }

  .popup .headline{ font-size:24px; font-weight:bold; color:#1c1c1c; line-height:1.25; }
  .popup .sub-line{ font-size:14px; color:#555; margin-top:8px; }
  .popup .msg{ font-size:14px; color:#333; margin-top:14px; font-style:italic; background:var(--cream); padding:10px 14px; border-radius:10px; }
  .popup .vip-ribbon{ display:inline-block; margin-top:12px; font-size:12px; font-weight:bold; letter-spacing:1px; padding:5px 16px; border-radius:20px; background:linear-gradient(90deg,#d4af37,#f5d576); color:#5c4400; }
  .popup .type-badge{ display:inline-block; margin-top:10px; font-size:11px; font-weight:bold; padding:3px 12px; border-radius:14px; background:#eef2f9; color:var(--navy); }
</style>
</head>
<body>

<div class="brand">
  <h1>Branch Central Library<br>Honavar</h1>
  <div class="sub">Welcome! Please scan or type your ID to check in</div>
</div>

<div class="scan-card">
  <div class="scan-icon">&#x1F4F7;</div>
  <input type="text" id="idInput" placeholder="Your ID" autofocus onkeydown="if(event.key==='Enter')doCheck()">
  <div class="hint">Press Enter after scanning or typing</div>
  <div style="margin-top:14px; font-size:13px; opacity:.8;">Don't have your card? Search by name below</div>
  <input type="text" id="nameSearchInput" placeholder="Type your name..." style="margin-top:8px;" oninput="gateNameSearchBox()" onkeydown="if(event.key==='Enter')gateNameSearchEnter()">
  <div id="nameSearchResults" style="margin-top:6px;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="popup" id="popup"></div>
</div>

<script>
  var PERSON_ICON = '<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>';

  document.getElementById('idInput').addEventListener('blur', function(){
    setTimeout(function(){
      var active = document.activeElement;
      if (active && active.id === 'nameSearchInput') return;
      document.getElementById('idInput').focus();
    }, 200);
  });

  function speak(text){
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.95;
      utter.pitch = 1.02;
      window.speechSynthesis.speak(utter);
    } catch(e){}
  }

  var nameSearchTimer = null;
  var gateNameResults = [];
  function gateNameSearchBox(){
    var q = document.getElementById('nameSearchInput').value.trim();
    var box = document.getElementById('nameSearchResults');
    if (nameSearchTimer) clearTimeout(nameSearchTimer);
    if (q.length < 2){ box.innerHTML = ''; gateNameResults = []; return; }
    nameSearchTimer = setTimeout(function(){
      google.script.run.withSuccessHandler(function(list){
        gateNameResults = list;
        if (!list.length){ box.innerHTML = '<div class="name-result-item" style="cursor:default;">No match found</div>'; return; }
        box.innerHTML = list.map(function(p){
          return '<div class="name-result-item" onclick="gateNamePickBox(\''+p.id+'\')"><b>'+p.name+'</b><span>'+p.type+' \u2022 ID '+p.id+'</span></div>';
        }).join('');
      }).searchPeopleByName(q);
    }, 300);
  }
  function gateNameSearchEnter(){
    if (gateNameResults.length) gateNamePickBox(gateNameResults[0].id);
  }
  function gateNamePickBox(id){
    document.getElementById('nameSearchInput').value = '';
    document.getElementById('nameSearchResults').innerHTML = '';
    gateNameResults = [];
    document.getElementById('idInput').value = id;
    doCheck();
  }

  function doCheck(){
    var id = document.getElementById('idInput').value.trim();
    if (!id) return;
    document.getElementById('idInput').value = '';

    function submit(lat, lng){
      google.script.run
        .withSuccessHandler(showResult)
        .withFailureHandler(showError)
        .gateCheckInOut(id, lat, lng);
    }

    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(pos){ submit(pos.coords.latitude, pos.coords.longitude); },
        function(){ submit(null, null); },
        { timeout: 6000, enableHighAccuracy: true }
      );
    } else {
      submit(null, null);
    }
  }

  function closePopup(){
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('idInput').focus();
  }

  function showResult(r){
    var isVip = String(r.vip).toUpperCase() === 'YES';
    var cls = isVip ? 'vip' : (r.inOut === 'IN' ? 'in' : 'out');
    var avatarHtml = r.photo ? '<img src="'+r.photo+'">' : PERSON_ICON;
    var headline = r.inOut === 'IN' ? ('Welcome, ' + r.name + '!') : ('Thank you for visiting, ' + r.name + '!');
    var subLine = r.inOut === 'IN'
      ? (r.type === 'Member' ? 'Member' : 'Visitor') + ' checked in'
      : 'Visited for ' + (r.readingTime || '-') + ' - please visit again';

    var popup = document.getElementById('popup');
    popup.className = 'popup ' + cls;
    popup.innerHTML =
      '<div class="avatar">'+avatarHtml+'</div>'+
      '<div class="headline">'+headline+'</div>'+
      '<div class="sub-line">'+subLine+'</div>'+
      (r.message ? '<div class="msg">'+r.message+'</div>' : '') +
      '<div class="type-badge">'+(r.type==='Member'?'Library Member':'Visitor')+'</div>'+
      (isVip ? '<div class="vip-ribbon">\u2728 VIP GUEST \u2728</div>' : '');

    document.getElementById('overlay').classList.add('show');

    var speechText = r.inOut === 'IN'
      ? (r.message ? r.message : ('Welcome, ' + r.name + '!'))
      : ('Thank you for visiting, ' + r.name + '. Please visit again.');
    speak(speechText);

    setTimeout(closePopup, 6500);
  }

  function showError(err){
    var popup = document.getElementById('popup');
    popup.className = 'popup error';
    popup.innerHTML =
      '<div class="avatar">'+PERSON_ICON+'</div>'+
      '<div class="headline">Not Found</div>'+
      '<div class="sub-line">'+(err.message||err)+'</div>';
    document.getElementById('overlay').classList.add('show');
    speak('Sorry, we could not find that. Please try again or ask the library staff for help.');
    setTimeout(closePopup, 6000);
  }
</script>
</body>
</html>
